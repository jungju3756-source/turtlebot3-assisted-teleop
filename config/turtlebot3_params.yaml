assisted_teleop_bridge:
  ros__parameters:
    # ── 토픽 ──────────────────────────────────────────────────────────────────
    scan_topic:   /scan        # TB3 기본 LiDAR 토픽
    input_topic:  /joy_vel     # teleop_twist_joy -> joy_vel -> 이 노드 -> /cmd_vel
    output_topic: /cmd_vel     # TB3 구동 명령 토픽

    # ── 로봇 Footprint (TurtleBot3 Burger) ───────────────────────────────────
    # LiDAR가 로봇 중앙 상단에 장착 → 오프셋 0
    laser_x_offset: 0.0
    laser_y_offset: 0.0
    # Burger 크기: 전장 ~0.14m, 폭 ~0.178m
    robot_front_m:  0.17
    robot_half_w:   0.09

    # ── 제동 거리 ─────────────────────────────────────────────────────────────
    free_dist_m:    0.50   # 이 거리 이상이면 ADAS 개입 없음
    guard_dist_m:   0.10   # 긴급 정지 거리 (범퍼 기준)
    min_speed_frac: 0.35   # 회피 중 최소 속도 비율

    # ── VFH ───────────────────────────────────────────────────────────────────
    steer_gain:     2.0    # 조향 강도 (rad/s per rad)
    max_correction: 0.80   # 급회전 방지 최대 조향량 (rad/s)
    clearance_m:    0.25   # 방향 통과 최소 거리 (범퍼 기준)
    w_smooth_alpha: 0.40   # 각속도 스무딩 계수 (0=즉각, 1=최대 스무딩)

    enable_threshold: 0.05
    idle_timeout:     0.5
