tof_bridge:
  ros__parameters:
    # 8x8 그리드의 정중앙 2x2 (행 3-4, 열 3-4)만 사용 → 전방 중앙 거리.
    # (이전 [1,6]=6x6 36존 min 은 가장자리 근접물을 잡아 depth/lidar 와 크게 어긋남)
    roi_rows: [3, 4]
    roi_cols: [3, 4]
    valid_status: [5, 9]
    stale_timeout: 0.5
    publish_rate: 20.0

obstacle_detector:
  ros__parameters:
    # 정면 2단계 감지
    enter_threshold: 0.35       # m  감지 거리 (어느 센서든 이 이하면 AVOIDANCE 진입)
    exit_threshold: 0.50        # m  MANUAL 복귀 거리
    sector_deg: 30.0            # °  LiDAR 정면 섹터 (±이 값)
    lidar_min_range: 0.12       # m  LiDAR 유효 최소 거리
    lidar_confirm_threshold: 0.35 # m  LiDAR 정면 감지 거리
    # 측면/대각 보호
    side_sector_lo_deg: 55.0    # °  측면 섹터 시작 (전방 0° 기준)
    side_sector_hi_deg: 120.0   # °  측면 섹터 끝
    side_threshold: 0.30        # m  측면 이 거리 이하면 즉시 AVOIDANCE 진입
    rate: 20.0

gap_analyzer:
  ros__parameters:
    sector_deg: 15.0
    robot_width: 0.178        # m (버거 폭)
    margin: 0.10              # m
    required_gap: 0.278       # m (robot_width + margin)
    rate: 10.0

avoidance:
  ros__parameters:
    v_forward: 0.08
    w_turn: 0.4
    # back_v: 미사용 (후진 제거됨)
    side_window_deg: 90.0
    blocked_threshold: 0.15
    rate: 20.0

arbitrator:
  ros__parameters:
    cmd_timeout: 0.3
    rate: 20.0
